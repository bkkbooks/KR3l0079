  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3l0079_WYG_001-1a, image: WYG1040/WYG1040-0226a.png}
body:
  text: 歸潛志卷一元劉祁撰金海陵庶人讀書有文才為藩王時嘗書人扇云大柄若在手清風滿天下人知其大志正隆南征至維揚望江左賦詩云屯兵百萬西湖上立馬吳山第一峯其志氣亦不淺宣孝太子世宗子章宗父也追諡顯宗好文學作詩善畫人物馬尤工迄今人間多有存者章宗天資聰悟詩詞多有可稱者宫中絶句云五雲金碧拱朝霞樓閣峥嶸帝子家三十六宫簾盡捲東風無處不楊花真帝王詩也命翰林待制朱瀾侍夜飲詩云夜飲何所樂所樂無喧譁三杯淡醽醁一曲冷琵琶坐久香成穗夜深燈欲花陶陶復陶陶醉鄉豈有涯聚骨扇詞云幾股湘江龍骨瘦巧樣翻騰疊作湘波皺金鏤小鈿花草鬭翠絛更結同心綬金殿日長承宴久招來暫喜清風透忽聽傳宣須急奏輕輕褪入香羅袖又擘橙為軟金杯詞風流紫府郎痛飲烏紗岸柔軟九回腸冷怯玻璃碗纖纖白玉蔥分破黃金彈借得洞庭春飛上桃花面嘗為鐵券行數十韻筆力甚雄又有送張建致仕歸弔王庭筠下世詩具載飛龍記中豫王允中世宗第四子也好文善歌詩有樂善老人集行於世密國公璹字仲實世宗之孫越王允功之子也幼有俊才能詩工書自號樗軒居士宣宗南渡防忌同宗親王皆有門禁公以開府儀同三司奉朝請家居止以講誦吟詠為樂時時潛與士大夫唱酬然不敢彰露正大間余入南京因訪僧仁上人會公至相見欣然其舉止談笑真一老儒殊無驕貴之態後因造其第一室蕭然琴書滿案諸子環侍無俗談可謂賢公子矣乃出其所藏書畫數十軸皆世間罕見者後余適陳送以二詩甚佳又為余先子集作後序一時文士如雷希顔元裕之李長源王飛伯皆遊其門飛伯嘗有詩云宣平坊裏榆林巷便是臨淄公子家寂寞畫堂豪貴少時容詞客聽琵琶蓋實録也天興初北兵犯河南公已卧疾豫候之因諭及時事公曰敵勢如此不能支止可以降心從順全吾祖宗如得完顔氏一族歸我國中使女直不滅則善矣餘復何望乎後數月薨五子幼曰守禧字慶之年少亦有俊才作詩與字畫亦可喜狀貌白晳丰神秀徹如仙人公特鍾愛嘗會豫指其書畫曰將以付斯人公薨崔立之變皇族皆聚於禁中將北遷慶之病死年未三十公平生詩文甚多晚自刋其詩三百首樂府一百首號如菴小藁趙間間序之行於世其佳句有聞間間再起為翰林云蓮炬光中久廢吟一朝超擢睿恩深四朝耆舊大宗伯三紀聲名老翰林人道蛟龍得雲雨我知麋鹿強冠襟寶巖谾谷西窗夢不信秋來不上心又過胥相墓云亭亭華表立朱門始信征南宰相尊下馬讀碑人不識夷山髙處望中原甚有唐人逺意又絶句孟津休道濁于涇若遇承平也敢清河朔幾時桑柘底只談王道不談兵不可謂無志者也趙學士秉文字周臣磁州滏陽人少擢第作詩及字畫有名王庭筠子端薦入翰林因言事忤旨外補後再入館為修撰待制轉禮部郎中出典岢嵐平定寧邊三郡案金史本傳秉文以言事由翰林修撰出典平定寧邊二郡未嘗出典岢嵐其同知岢嵐州軍事猶在未召入為修撰之前元好問中州集傳亦與本傳同與此互異南渡為直學士遷侍讀拜禮部尚書致仕再起為禮部改翰林學士天興改元夏四月卒年七十三案金史本傳天興改元之年五月壬辰卒年七十四與此志異公幼年詩與書皆法子端後更學太白東坡字兼古今諸家學及晚年書大進詩専法唐人魁然一時文士領袖夀考康寧爵位士大夫罕及焉性疏曠無機鑿治民鎮靜不生事在朝循循無異言家居未嘗有聲色之娛夫人卒不再娶斷葷肉粗衣糲食不恤也酷好學至老不衰後兩目頗昏猶孜孜執卷抄録上至六經解外及浮屠莊老醫藥丹訣無不究心其所著有太玄解老子解南華指要滏水集外集無慮數十萬言自號間間居士云李翰林純甫字之純宏州襄隂人祖安上嘗魁西京進士父采仲文卒于益都府治中公幼頴悟異常兒初為詞賦學後讀左氏春秋大愛之遂更為經義學踰冠擢髙第名聲赫然為文法莊周左氏故其辭雄竒簡古人皆宗之文風由此一變又喜談兵慨然有經世心泰和南犯兩上疏䇿其勝負章宗咨異給送軍中後多如所料宰執竒其文薦入翰林及北方兵起又上疏論事不報宣宗南渡再入翰林時丞相珠格髙琪案珠格舊作术虎今改擅權擢為左司都事公審其必敗以母老辭去俄而髙琪誅死識者智之再入翰林連知貢舉正大末由取人踰新格出倅坊州未赴改京兆府判官卒於南京年四十七公為人聰敏于學無所不通少自負其才謂功名可俯拾作矮柏賦以諸葛孔明王景略自期由小官上萬言書援宋為證甚切當路者以迂闊見抑士論惜之中年度其道不行益縱酒自放無仕進意得官未嘗成考旋即歸隱居間與禪僧士子遊惟以文酒為事嘯歌袒裼出禮法外或飲數月不醒人有酒見招不擇貴賤必往往輒醉雖沈醉亦未嘗廢著書至于談笑怒罵燦然皆成文理天資喜士後進有一善極口稱推一時名士皆由公顯于世又與之拍肩爾汝忘年齒相歡教育撫摩恩若親戚故士大夫歸附號為當世龍門嘗自作屏山居士傳末曰惟喜推借後進如周嗣明張瑴李經王權雷淵余先子姓名劉從益宋九嘉皆以兄呼而居士使酒玩世人忤其意輒嫚罵之皆其志趣也其自贊曰軀幹短小而芥視九州形容寢陋而蟻蝨公侯言語蹇吃而連環可解筆札訛癡而挽回萬牛寧為時所棄不為名所囚是何人也耶吾所學者淨名莊周晚自類其文凡論性理及關佛老二家者號內藁其餘應物文字如碑志詩賦號外藁蓋擬莊子內外篇又解楞嚴金剛經老子莊子又有中庸集解鳴道集解號為中國心學西方文教數十萬言嘗曰自莊周後惟王績元結鄭厚與吾此其所學也每酒酣厯厯論天下事或談儒釋異同雖環而攻之莫能屈世豈復有此俊傑人哉雷翰林淵字希顔應州渾源人與余同里閈且姻家也父思西仲名進士仕至同知北京轉運司注易行于世公幼喪父以孤童入太學讀書晝夜不休雖貧甚不以介意從李屏山遊遂知名俄中髙第調涇州録事坐髙庭玉獻臣之獄幾死後改東平遷東阿令授徐州觀察判官興定末召為英王府文學俄入翰林為應奉拜監察御史言五事稱旨又彈劾不避貴臣出巡郡邑所至有威譽凡姦豪不法者立箠殺之坐此為小人所訟罷去久之起為太學博士南京轉運司户籍判官遷翰林修撰一夕暴卒年四十八案金史本傳亦云四十八與此志同元好問雷希顔墓銘卒年四十六與此志異公博學有雄氣為文章専法韓昌黎尤長于敘事詩雜坡谷喜新竒好收古人書畫碑刻藏于家甚富喜結交凡當途貴要與布衣名士無不往來居京師賓客踵門未嘗去舍後進經公品題以為榮家無餘資及待賓客豐腆甚蒞官喜立名初登第攝令遂平一邑大震嘗笞州魁吏州檄召不應罷去後凡居一職輒震耀亦坐此仕不逹然士論未嘗不壯之嘗為文祭髙公獻臣其詞髙古一時傳誦工于尺牘辭簡而甚文朋友得之輒以為珍藏發書頃刻數十軸皆得體堪愛在館諸同年友制辭皆摘其不及以針之如誥商衡平叔云將迎間有亦須風節之自持誥聶天驥元吉云讀書大可益人宜勤講學少年賦松菴詩曰菴中偃卧龍閲世鬚髯古人天共護持半夜起風雨過華山懷陳希夷云五季乾坤半晦冥先生有意事澄清齁齁四十年來睡開眼東方日已明又梅影云維摩丈室冷于冰千劫蕭然無盡燈天女散花愁不寐夜深髙髻影鬅鬙人皆傳之初善李屏山後善馮公叔獻後善髙公獻臣最後善趙公周臣陳公正叔早與余先子交嘗同鄉校同太學後同朝先子歿公寄挽詩有云鄉校聨裾春誦學上庠同榻夜論心余因請為墓志迄今余家有公書簡甚多也善飲啖未嘗見大醉間論事口吃而甚辨出竒無窮真豪士也宋翰林九嘉字飛卿夏津人少遊太學有詞賦聲從屏山遊讀書為文有竒氣與雷希顔李天英相埒也至寧初擢髙第厯關中四邑以能稱召補省掾為當軸者所忌求去已而為延安帥府所辟充經厯官召為南京右巡院使風采甚著以不能事權要罷官俄入翰林為應奉得風疾引去遭亂北還道病歿年未五十士大夫惜之飛卿為人剛直豪邁不羣能政能文甚為時望所屬不幸中以病廢哀哉初召至南京時屏山亦在余每從之遊亂後余居八仙館與飛卿相邇日相見屬和其詩猶在余槖中少時題太白泛月圖云江心月影盡一掬船頭杯酒盡一吸夜深風露點宫袍天地之間一李白可想見其意氣也文辭簡古法宋祁新唐書惜乎為吏事所奪不多著性不喜佛雖從屏山遊常與辨爭在關中時因楊煥然赴舉書與屏山薦之曰煥然佳士往見吾兄慎無以佛老乃嫚之也屏山持之示交遊以為笑其後西行余以序送之備論其守道不回今兹云亡豈復見此挺特之士乎歸潛志卷一
