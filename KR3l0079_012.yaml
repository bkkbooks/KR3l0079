body:
  text: 歸潛志卷十二元劉祁撰録崔立碑事崔立既變以南京降自負其有救一城生靈功謂左司員外郎元裕之曰汝等何時立一石書吾狀耶時立國柄入手生殺在一言省庭日流血上下震悚諸在位者畏之于是乎有立碑頌功德議數日忽一省卒詣余家齎尚書禮房小帖子云首領官召赴禮部余初愕然自以布衣不預事不知何謂即往至省門外遇麻信之余因語之信之曰昨日見左司郎中張信之言鄭王碑事欲屬我輩作豈其然耶即同入省禮房省掾曹益引見首領官張信之元裕之二人曰今鄭王以一身救百萬生靈其功德誠可喜今在京官吏父老欲為立碑紀其事衆議屬之二君且已白鄭王矣二君其無讓余即辭曰祁輩布衣無職此非所當為況有翰林諸公如王文從之及裕之輩在祁等不敢裕之曰此事出于衆心且吾曹生自王得之為之何辭君等無讓余即曰吾當見王丈論之裕之曰王論亦如此矣余即趨出至學士院見王丈時修撰張子忠應奉張元美亦在焉余因語其事且曰此實諸公職某等何預焉王曰此事議久矣蓋以院中人為之若尚書檄學士院作非出于在京官吏父老心若自布衣中為之乃衆欲也且子未仕在布衣今士民屬子子為之亦不傷于義也余于是陰悟諸公自以仕金顯達欲避其名以嫁諸布衣又念平生為文今而遇此患難以是知揚子雲劇秦美新其亦出于不得已耶因遜讓而别連延數日又被督促知不能辭即略為草定付裕之一二日後一省卒來召云諸宰執召君余不得已赴省途中遇元裕之騎馬索余因劫以行且拉麻信之俱往初不言碑事止云省中召王學士諸公㑹飲余亦陰揣其然既入即引詣左參政幕中見參政劉公謙甫舉杯屬吾二人曰大王碑事衆議煩公等公等成之甚善余與信之俱遜讓曰不敢已而謙甫出見王丈在焉相與酬酢酒數行日將入矣余二人告歸裕之曰省門已鎖今夕即當留宿省中余輩無如之何已而燭至飲余裕之倡曰鄭王碑文今夕可畢手也余曰有諸公在諸公為之王丈謂余曰此事鄭王已知衆人請太學中名士作子如堅拒使王知書生輩不肯作是不許其以城降也則銜之刻骨縉紳俱受禍矣是子以一人纍衆也且子有老祖母老母在堂今一觸其鋒禍及親族何以為智子熟思之余懼以非職辭久之且曰余既為草定不當諸公意請改命他人諸公不許促迫甚余知其事無可奈何則曰吾素不知館閣體今夕諸公共議之如諸公避其名但書某名在諸公後于是裕之引紙落筆草其事王丈又曰此文姑使裕之作以為君作又何妨且君集中不載亦可也余曰裕之作政宜某復何言碑文既成以示王丈及余信之欲相商評王丈為定數字其銘詞則王丈裕之信之及存余舊數言其碑序全裕之筆也然其文止實叙事亦無褒稱立言時夜幾四鼓裕之趣曹益甫書之裕之即于燭前焚其藁遲明余輩趨去後數日立坐朝堂諸宰執首領官共獻其文以為夀遂召余信之等俱詣立第受官余輩深懼見立俄而諸首領官齎告身三通以出付余輩曰特賜進士出身因為余輩賀後聞求巨石不得省門左舊有宋徽宗時甘靈碑有司取而磨之工書人張君庸者求書刻方畢北兵入城縱剽余輩狼狽而出不知其竟能立否也嗟乎諸公本畏立禍不敢不成其言已而又欲避其名以賣布衣之士余輩不幸有虛名一旦為人之所劫欲以死拒之則發諸公嫁名之機諸公必怒怒而達崔立禍不可測則吾二親何以自存吾之死所謂自經于溝瀆而莫之知且輕殺吾身以憂吾親為大不孝矣況身未祿仕權義之輕重親莫重焉故余姑𨼆忍保身為二親計且其文皆衆筆非余全文彼欲嫁名于余余安得而辭也今天下士議往往知裕之所為且有曹通甫詩楊叔能詞在亦不待余辨也因書其首尾之詳以志年少之過空山靜思可以一笑辨亡或問金國之所以亡何哉末帝非有桀紂之惡害不及民疆土雖削士馬尚强而遽至不救亦必有說余曰觀金之始取天下過于後魏後唐石晉遼然其所以不能長久者根本不立也當其取遼時誠與後魏初起不殊及取宋責其背約名為伐罪弔民收徽宗圗書車服褒崇元佑諸正人取蔡京童貫王黼諸奸黨皆以順百姓望由能用遼宋人材如韓企先劉彥能韓昉輩也及得天下其封建廢置政令如前朝典章法度皆出于書生至海陵庶人雖淫暴自强然英鋭有大志定官制律令皆可觀又擢用人材將混一天下功雖不成其强至矣世宗天資仁厚善于守成又躬自儉約以育士庶故大定三十年幾致太平所用多敦厚謹勑之士如石琚輩為相不煩擾不更張偃息干戈修崇學校議者以為有漢文景風此所以基明昌承安之盛也宣孝太子最髙明絶人讀書喜文欲以變易風俗行中國禮樂如魏孝文天不祚金不即大位早世章宗聰慧有父風屬文為學崇尚儒雅故一時名士輩出大臣執政多有文采學問可取能吏直臣皆得顯用政令修舉文治爛然金朝之盛極矣然文學止于詞章不知講明經術為保國保民之道以圖基祚久長又頗好浮侈崇建宫闕外戚小人多預政且無志聖賢髙躅大臣惟知奉承不敢逆其所好故上下皆無維持長世之策安樂一時此所以啓大安貞祐之弱也衛王苛吝不知人君體不足言已而强敵生邊賊臣得柄外內交病莫敢療理宣宗立于賊手本懦弱無能性頗猜忌懲權臣之禍恆恐為人所搖故大臣宿將有罪必除去不貸其遷都大梁可謂失謀向使守關中猶可以數世況南渡之後不能苦心刻意如越王句踐志報㑹稽之羞但茍安幸存以延嵗月由髙琪執政後擢用胥吏抑士大夫之氣不得伸文法紛然無興復逺略大臣在位者亦無忘身徇國之人縱有之亦不得馳騁又偏私族類疏外漢人其機密謨謀雖漢相不得預人主以至公治天下其分别如此望羣下盡力難哉故當路者惟知迎合其意謹守簿書而已為將者但知奉承近侍以偷幸寵無效死之心幸臣貴戚皆據要職于一時士大夫一有敢言敢為者皆投置散地此所以啓天興之亡也末帝奪長而立出于愛私雖資不殘酷然以聖智自處少為黠吏時全所教用術取人雖外示寬宏以取名內實淫縱自肆且諱言過惡喜聽諛言又暗于用人其將相止取從來貴戚雖不殺大臣其驕將多難制不馴況不知大略臨大事輒退怯自沮此所以一遇勍敵而不能振也大抵金國之政雜用遼宋法令所以支持百年然其分别漢人且不變家政不得士大夫心此所以不能長久向使大定後宣孝得立盡行中國法明昌承安間復知保守整頓以防後憂南渡之後能內修政令以恢復為志則其國祚亦未必遽絶也嘗記泰和間有雲中李純甫由小官上書萬言大略以為此政當有為日而當路以為迂闊笑之宴安自處以至土崩瓦解南渡後復有以機㑹宜急有備為言者而上下泰然俱不以為心以至宗廟丘墟家國廢絶此古人所謂何世無竒材而遺之草澤者也金銀珠玉世人所甚貴及遇凶年則不及菽粟何哉事有先後勢有緩急也平時富貴之家求一珠玉犀𧰼玩好器物至發粟出帛惟恐其不得將以充其室誇耀于人以自樂者皆是也壬辰嵗余在大梁時城久被圍公私乏食米一升至銀二兩餘殍死者相望人視金銀如泥土使用不計士庶之家出其平日珠玉玩好妝具環珮錦繡衣衾日陳于天津橋市中惟博鬻升合米豆以救朝夕嘗記余家一毳袍極緻密鮮完博米八升金叉易牛肉一肩趨售之以是知明君貴五榖而賤金玉誠知其本也古人云薪如桂米如珠豈虛言哉文章各有體本不可相犯欺故古文不宜蹈襲前人成語當以竒異自强四六宜用前人成語復不宜生澀求異如散文不宜用詩家語詩句不宜用散文言律賦不宜犯散文言散文不犯律賦語皆判然各異如雜用之非惟失體且梗目難通然學者暗于識多混亂交出且互相詆誚不自覺知此弊雖一二名公不免也長于此者必短于彼優于大者或劣于小士君子窮處不能活妻子免飢寒及其得志則兼濟天下使民物各得所太公困于鼓刀釣漁伊尹躬耕莘野彼豈不能妄營財利使生理優游耶恥不為也若夫韓淮陰少年乞食漂母人皆笑嗤及為將料敵制勝無遺策卒能佐漢祖定天下身享南面之樂豈昔之拙而今之巧耶材有所長志有所不為也因是以思吾儕今日遭大變遁于窮山荒野中日惟糊口之不給而不免有求于人亦不足怪但恨不能自漁樵親耕稼以自給如古之人耳彼窮居妻子有愠言鄉人賤人交游笑之又何病也理固然也國家養育人材當如養木彼楩楠豫章之材封植之護持之任其長成一旦可以為明堂太室之用如或牛羊囓之斧斤伐之則將憔悴慘淡無生姿或枯槁而死矣又安能有干霄拂雲之勢耶士大夫亦然國家以爵祿尊之以語言使之精神橫出才氣得伸鋭于有為然後得為用倘繩以文法索過求瑕為之則有議言之則有罪將括囊袖手相招為自全計矣國家何賴焉余先君嘗為言如屏山之才國家能獎養挈提使議論天下事其智識蓋人不可及惟其早年暫欲有為有言已遭摧折所以中年縱酒無功名心是可為國家惜也嗚呼自非堅剛不拔之志超世絶倫之人其遇憂患遭廢絀而不變易者鮮矣哉𫝊曰人衆亦能勝天天定亦能勝人余嘗疑之誠以嚴冬在大厦中獨立慘淡不能久居忽有人自外至共談笑則殊暖燠蓋人氣勝也因是以思謂人勝天亦有此理豈特是哉深冬執爨或厚衣重衾亦不寒夏暑居髙樓以氷環坐而加之以扇亦不甚熱大抵有勢力者能不為造物所欺然所以有勢者亦造物所使也人之生有三樂有志氣之樂有形體之樂有性命之樂夫事業功名權勢爵位樂志氣也酒色衣食使令車馬樂形體也仁義禮樂忠信孝弟樂性命也雖然事業功名權勢爵位得時者之所有也酒色衣食使令車馬富厚者之所備也惟仁義禮樂忠信孝弟雖不得時不富厚而于我皆具蓋窮士之所有也今吾既不得時有志氣之樂又不富厚有形體之樂居荒山之中日惟藜藿之為養其所享無一毫過于人捨性命其何樂哉士之生于世何其多品耶有為公卿宰輔以事業功名顯于後代者有雖居下位不得柄用猶能以節義自著者又有浮沈閭里應物持身但以德善立名者有放浪山林草衣木食以髙潔自居者有抒心文史以著述吟諷有聞者又有研精技藝如陰陽醫藥卜筮字畫繪畫以名世者又有縱酒放歌撥棄禮法以樂其形體者又有抑情忘欲鍊身服氣以覬飛升者要之各從所好且有定數亦安能一其迹耶今吾幼而苦學及于齒壯學雖粗成而未有所遇合窮居草野日惟衣食之不充將為事業功名而不可得又非居位當言且臨事變可以立節義願服鍊以懶惰不能放縱以拘窒不喜諸技藝皆非所専心平生以經籍文翰自娛顧後日窮達猶未可知然則獨守吾殘編斷藁者猶未為癡計也豫生壯年其所厯多矣嘗陪諸舉子進取矣亦嘗偕諸朋友講學矣又嘗視諸農夫耕穫矣又嘗同諸少年嬉逰矣又嘗詣諸王公貴人干謁矣自是上為卿相行輕濟之謀下為僕吏執奔走之役其于世故無所不涉今而時值亂離屏居故山之下回思向者之事擾擾膠膠于身初無少異所謂如夢覺如酒醒而不見纖毫形迹以此觀之百年之內亦可以默覺矣而獨區區慮衣食之不充懼志意之不得而不能樂天知命坎止流行與萬物同始終亦其學之不至也哀哉三國時士尚權詐其間不為風俗所移者陳實徐稚魏晉間士尚虛𤣥其間不為風俗所移者徐邈卞壼兹數人者或以道德顯或以節行聞或以智量稱或以風義著立身行志卓爾不羣皆豪傑之士也余嘗觀道藏書見其練石服氣以求長生登仙又書符呪水役使鬼神為人治病除祟且自立名字職位云主管天神而齊醮祈禳則乃能轉禍為福大抵方士之術其有無誰能知又觀佛書見談天堂地獄因果輪回以為人與禽獸異且有千佛萬聖異世殊劫而以持誦布施則乃生善地大抵西方之教其有無亦誰能知因思吾道天地日月明照山河草木蕃息其間君臣父子兄弟夫婦禮文粲然而治國治家煥有條理賞罰黜陟立見榮枯生死窮通互分得失其明白如此豈有惑人以不可知之事者哉而世之愚俗徒以二氏之詭誕怪異出耳目外則波靡而從之而飲食起居日在吾道中而恬不自知反以為尋常者良可歎也嗚呼愚俗豈可責耶而士大夫之髙明好異者往往為所誘不亦悖哉舉世之人日奔走經營惟以衣食為事士君子則安閒樂道不以衣食為憂舉世之人所畏者飢寒患難死亡士君子則于飢寒患難死亡無所畏使道義充于中雖明日飢而死無歉于天地使行不義而動非禮雖貴于王公富積千金而內以愧于心外以怍于人然則士君子之所為所守誠舉世之人所背而馳者也使俗人笑其迂而議其拙也宜哉歸濳志卷十二
