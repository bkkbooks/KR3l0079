body:
  text: 歸潜志小說家類一雜事之屬提要臣等謹案歸潜志十四卷元劉祁撰祁字京叔渾源人御史從益之子為太學生舉進士不第元兵入汴遁還鄉里戊戌復出就試魁南京選充山西東路考試官從征南行省辟置幕府凡七年而歿舊以金史載之文藝傳遂題曰金人殊非其實是書名曰歸潜蓋祁于壬辰北還以此二字榜其室因以題其所著然晚年再出西山之節不終亦非其實也卷首有祁乙未自序謂昔所聞見暇日記憶隨得隨書第一卷至六卷悉為金末諸人小卷第七卷至三十卷雜記遺事第十一卷題曰録大梁事紀哀宗亡國始末第二卷題曰録崔立碑事紀立作亂時廷臣立碑以媚之劫祁使撰文事又一篇題曰辨亡敘金前代之所以治平末造之所以亂亡自此二篇以下至十三卷悉為雜記略如語録之體殊不相類疑此二篇本自為一卷殿全書之末别以語録為第十三卷詩文為第十四卷附綴於後後人因萹頁不均割語録之半移綴此卷故體例參差也壬辰之變祁在汴京目擊事狀紀載胥得其實故金史本𫝊稱祁此志於金末之事多有足徵哀宗本紀全以所言為據義若大金國志稱樞密使伊喇蒲阿出降於元此志不書出降與金史相合可證大金國志之誤元史稱壬辰正月太宗自白波濟河而南睿宗由峭石灘涉漢而北以渡河涉漢同在一時而此志則載睿宗涉漢在辛卯十一月太宗渡河乃在壬辰與金史及姚燧牧菴集蘇天爵名臣事略所記相合可證元史之誤又如載天興元年劉元規使北朝不知所終而金史不紀不書其事載薩克蘇媒蘖李元妃本紀不著其名載大定十七年三月朔諸國使臣朝見遇雨放朝與周輝北轅録合而本紀但載十六年三月朔日蝕放朝一條載金代鈔法凡八易其名而金史食貨志失載通貨改為通寶通寶又改為通貨一條皆足以補正史之闕至于金史交聘表稱大定十六年宋湯邦彥充申請使此志作祈請使圖克坦烏登𫝊稱天興元年正月朝廷聞大兵入饒風關移烏登行省閿鄉以備潼關此志書其事於正大八年完顔思烈𫝊載王渥從思烈戰歿此志作從持嘉喀齊喀英𫝊稱與元兵遇于霸州敗死此志作遇于潞郭阿林𫝊稱宋兵大至遂戰歿此志作馬倒被擒不知存歿師安石𫝊贊稱以論列侍從觸怒而死此志則云既居位人望頗減皆有異詞其他年月先後姓名官階與史不同者甚多皆足以資互考談金源遺事者以此志與元好問壬辰離編為最金史亦並稱之壬辰雜編已佚則此志尤足珍貴矣世所行本皆八卷雖𫝊是樓藏本亦然國朝郭朝釪編纂金詩所採録僅及前七卷知其未見全帙此本一十四卷與王惲渾源世德碑相合當猶從元本𫝊録錢曾讀書敏求記稱陸孟鳬家鈔本歸潜志凡十四卷蓋即此本也乾隆四十六年八月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀歸潛志原序余生八年去鄉里從祖父游宦於大河之南時南京為行宫因得從名士大夫問學不幸弱冠而先子歿其後進於有司不得志將歸𨼆於太皥之墟一旦邅值金亡干戈流落由魏過齊入燕凡二千里甲午嵗復於鄉蓋年三十二矣因思向日二十餘年間所見富貴權勢之人一時烜赫如火烈者逮遭喪亂皆烟消灰滅無餘而吾雖貧賤一布衣猶得與妻子輩完歸是亦不幸之幸也由是以其所經涉憂患與夫被攻劫之苦奔走之勞雖飯疏飲水槖中無寸金未嘗蒂諸胸臆獨念昔所與交游皆一代偉人今雖物故其言論談笑想之猶在目且其所聞所見可以勸戒規鑒者不可使湮沒無𫝊因暇日記憶隨得隨書題曰歸潛志歸潛者余所居之堂之名也因名其書以志嵗月異時作史亦或有取焉嵗乙未季夏之望渾源劉祁京叔自叙
