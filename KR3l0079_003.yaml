body:
  text: 歸潛志卷三元劉祁撰侯策字季書先字君澤中山人少不喜學鬭雞走狗雄鄉里南渡後慨然有為學心與一時名士遊盡絶少年事喜作詩刻苦自學自漢魏六朝唐宋人諸集無不研究初為李子遷所知薦于余先子亦喜之王飛伯負其材素少許可一見季書詩即加敬為人任俠尚氣然修謹無過失與余交最深久之居南頓家甚貧遇朋友傾所有共樂天興改元陳亂失妻獨走大梁詣余會疾作數月死諸朋友為買棺葬西城余為志其墓刻石平生詩甚多同王飛伯唱和南頓同余唱和梁園又喜效西崑體甚有得其弔一貴人云歌翻薤露芻靈逺門掩秋風甲第深又云峯前雨送閨中夢峯一作蓬樓上雲凝扇底歌又明月花樓間玉鳳秋風桂漏戞銅龍又九疑湘瑟悲龍竹子夜秦簫隔鳳樓又幽鳥㺯音花覆地斷虹沈影水明河又詠雨云勢侵書帙湘藝潤聲入簾旌蠟炬清又和飛伯云世事催人南去早夢魂失路北歸遲置之唐人集中誰復疑其非也雷琯字伯威坊州人父秀實亦名進士伯威博學能文作詩典雅多有佳句時輩稱之初余過陽夏聞其名及一見傾倒歡甚後伯威赴葬余先子淮陽為誄文雅淡可喜余以示雷翰林竒之已而以家貧母老為國史院書寫秩滿為八作使亂後南奔道為兵士所殺年未四十哀哉伯威為人議論刻深然于文字甚工細每酒酣談説今古莫能窮又欲取竒異功名自喜亦不羈之士也其詩多散落有遊龍德宫云千年金谷銅駝怨萬里蜀天杜宇啼又明日清風一壺酒與君同酹信陵墳王鬱字飛伯竒士也少余一嵗與余交最深儀狀魁竒目光如鶻步武翩然相者云病鶴狀貌也少居鈞臺閉門讀書不接人事數載為文閎肆竒古動輒數千百言法栁栁州歌詩飄逸有太白氣象初為御史程公震所知繼為李翰林欽叔麻徵君知幾史盧氏學優嘉賞且共為延譽藉藉正大初余先子令葉飛伯持諸公書來投先子異其文置門下遂與余定交每觴酒宴遊無不在已而入南京見趙雷諸公皆稱之不已布衣少年名動京師後因下第西遊洛中余居淮陽凡三過留輒數月唱酬談論相髙每相别輒以所著相寄且相商訂為益正大末南京被圍復相守圍城中天興改元秋飛伯忽過余别曰吾跧伏陷穽不自得今將突圍逺舉然生死未可知因出其所作王子小傳屬余曰兹不朽之託也余不能止之而去三年不知存亡丙申嵗南遊遇交遊輩説飛伯初為東諸侯兵士所得其將厚遇之飛伯徑行不設機久之為其下所忌見殺臨終懷中出書曰是吾平生著述可傳付中州士大夫王飛伯死矣計其時年甫三十餘哭諸鎮陽蓋飛伯為人雖聰頴絶人然涉世日淺頗驁岸不通轍此所以不免豫嘗見其舉止言談無顧忌旁為􅋏然而飛伯益自信莫能戒以是常得謗議為俗人所憎迄今談其名不悅者多矣嗟乎以斯人之才氣稍有鍛鍊其文章所至豈易量哉今而中道摧折不迄于大成可以為斯文嘆其詩文往來與余最多有淮陽唱和南頓聫句古賦銘贊書序數十首遭亂皆在余槖中今仍略載其小傳云先生名青雄一名鬱大興府人也十五代祖圭相唐太宗官侍中永寧郡公曽祖衍金紫光祿大夫定海軍節度使兼萊州管內觀察使祖彥信邠州宜祿尉父欽山東路轉運司鹽鐵判官先生始生之月夢神人自天而下開所負紫絲囊賜一大雕且云吾後必來取其雕在地振羽一鳴驚而寤訪諸卜者繇曰凜凛霜鶚賜上穹既文于外又剛中法生貴子其應在公他日必作青雲之雄先生既生因採其語為名字年十八父歿家素富資纍千金遭亂蕩散無幾先生殊不以為意發憤讀書是時學者惟事科舉時文先生為文一掃積弊専法古人最早為麻徵君九疇所賞其潛心述作未嘗輕求人知李欽叔過鈞臺得其所著傷魯麟導懷等賦并楊孝童碑王夢祥哀辭大驚謄書遍薦于諸公先生之名始滿天下自此去鈞臺放遊四方又移隱陘山覃思古學正大五年先生年二十五矣來遊京師諸公倒屣爭識其面宰相聞其名取所作文章將薦之事中格樗軒皇叔密公璹間間朝廷二大老皆致禮于先生交館之明年以兩科舉進士不中西遊洛陽放懷詩酒盡山水之歡先生平日好議論尚氣自以為儒中俠所向敢為不以毁譽易心又自能斷大事其論學孔氏能兼佛老佛老為世害然有從事于孔氏之心學者徒能言而不能行縱欲行之又皆執于一隅不能周遍故嘗欲著書推明孔氏之心學又别言之行之二者之不同以去學者之弊其論經學以為宋儒見解最髙雖皆笑東漢之傳注今人惟蹈襲前人不敢誰何使天然之智識不具而經世實用不宏視東漢傳注尤為甚亦欲著書専與宋儒商訂其論為文以為近代文章為習俗所蠧不能遽洗其陋非有絶世之人奮然以古作者自任不能唱起斯文故嘗欲為文取韓栁之辭程張之理合而為一方盡天下之妙其論詩以為世人皆知作詩而未嘗有知學詩者故其詩皆不足觀詩學當自三百篇始其次離騷漢魏六朝唐人近皆置之不論蓋以尖慢浮雜無復古體故先王之詩必求盡古人之所長削去後人之所短其論詩之詳皆成書其論出處以為仕宦本求得志行其所知以濟斯民其或進而不能行不若居髙養豪行樂自適不為世網所羈頗以李白為則先生受知最深者曰樗軒公完顔璹間間公趙秉文余先子雷淵李獻能王若虛麻九疇史學優程震宋九嘉其從遊最久者曰李汾楊𢎞道元好問魏璠張邦直杜仁傑曹君一雷琯冀禹錫張介王説王采苓趙著張甫王鑄劉輯李同劉源楊煥胡權圖克坦公履案圖克坦舊作徒單今改吕鯤史環李倵侯策張傑劉郁左坦牛汝霖珠格邃烏凌阿爽案珠格舊作术虎烏凌阿舊作烏林答今改僧性英諸公隨得書無次第至于心交者惟李冶劉祁二人而已八年先生復至京師十二月遇兵難京城被圍先生上書言事不報明年四月圍稍解五月先生挺身獨出逺隱名山不知所終劉昻霄字景賢陵川人博學能文從屏山遊與雷希顔辛敬之元裕之善嘗由任子入官已而隱居洛西山水間踰四十病卒案元好問劉景元墓銘曰以元光元年六月十三日春秋三十有八終與此志年踰四十有異而中州集傳又云卒年三十七則與其所作墓銘又自不同其詩有云嵗月消磨詩硯裏河山浮動酒杯中迢迢萬里乾坤眼凜凜千年草木風元裕之嘗稱之余恨未之識也珠格邃字士玄先名玹字溫伯女直納琳明安也案納琳明安舊作納鄰猛安今改雖貴家刻苦為詩如寒士喜與士大夫遊初受學于辛敬之習左氏春秋後與侯季書交築室商水大野中惡衣糲食以吟咏為事詩益工時余在淮陽屢相從講學逮北兵入河南被命提兵戍亳州已而亳亂見殺年未四十也少年詩云山連嵩少雲煙晚地接崤函草樹秋其寄余云西湖風景昔同遊醉上蘭舟泛碧流楊栁風生潮水濶芙蕖煙盡野塘幽幽一作秋花邊落日明金勒雲裏清歌繞畫樓今夜相思滿城月梁臺楚水兩悠悠又睢陽道中云又渡溵江二月時睢陽東下思依依丘園寂寞生春草城闕荒涼對落暉去國十年初避亂投荒萬里正思歸臨岐郤羡春來鴈亂逐東風向北飛又書懷云關中客子去遲遲飄泊炎荒兩鬢絲三楚樓臺淹此日五陵鞍馬想當時春風草長淮陽路落日雲埋漢帝祠回首故鄉何處是北山天際緑參差甚有唐人風致烏凌阿爽字肅孺女直世襲穆昆也案穆昆舊作謀克今改風神瀟灑美少年性聰穎作竒語喜從名士遊居淮陽日詣余家夜歸其室抄寫諷誦終夕雖世族家甚貧為後母所制踰冠未娶惡衣糲食恬如遇交遊杯酒豪縱可喜余謂使其志不輟年稍長則當魁其輩流壬辰陳陷赴水死年未三十初賦鄴研詩有云上有丹錫花秋河碎星斗磨研清且厲玉瑟鳴風牖又賦古尺云一云賦古子背逐一道十三虹赤鬣金麟何夭嬌翻思昨夜雷霆怒只恐乘雲上天去又七夕曲云天上别離淚更多滿空飛下清秋雨其才清麗俊拔似李賀惜乎不見其大成也劉琢伯成中山人刻苦為學事母教弟以孝友聞朋友居鄧州人甚重之正大初舉進士南京余始與相識俄下第歸久之河南亂聞在武仙軍中仙使使宋回為所殺哀哉作詩甚工有云吳蠶絲就方成繭楚栁絲飛又作萍非淺淺者所能道也其過葉哭余先子詩亦佳史懷字季山陳郡人少遊宕不羈然有才思年既壯乃折節為學與名士李子遷侯季書王飛伯遊作詩甚有功冬日即事云簷雪日髙晴滴雨爐煙風定暖生雲亦可喜也又作古劍詩極工陳陷死劉昉字仲宣中山人讀書有才學作詩甚有可稱嘗作睢陽八詠工甚居西華之小姚鎮時來遊陳余識之遭亂歿髙永字信卿漁陽人倜儻尚氣輕財好交遊頗讀書喜談兵文辭豪放長于論事嘗從屏山遊與李長源元裕之杜仲梁李稚川相善纍舉不第家甚貧正大末余居淮陽信卿持諸公書來謁因為定交留月餘西去未幾同在南京被圍嘗上書言事不報以病死自號應庵胡權字直卿衛州人南渡有詩聲纍舉不第貧甚性狂狹不能容尋常人年過四十方娶嘗投余先子淮陽又與余同試于京遭亂北歸以病卒田永錫義州人叔思敬耀卿名進士永錫少有詩聲其過東坡墳詩云富貴一場春夜夢文章萬斛冷雲泉英魂返卻眉山秀依舊春風草木天為人傳誦興定末同余試南京擢第遭亂南奔在江淮間病卒李澥字公渡相州人王黃華門生也自號六峯居士工詩及字畫皆得法與黃華趙間間諸公遊連蹇科場竟不第至六十餘病歿時人言公渡賦不如詩詩不如字字不如畫科舉賦最緊然文至最緊下也興定末與余同試開封中選公渡甚喜有詩示余先子後云姓名偶脫孫山外文字幸為坡老知誰念三生李方叔欲將殘喘寄爐錘先子和答云瓶有儲糧鬢有絲蹉跎歲晚坐書癡輞川畫隱王摩詰錦里詩窮杜拾遺應舉尚陪新進士主文多是舊相知春闈看決魚龍陳未必尖錐勝鈍錐士林相傳以為笑談劉勳字少宣雲中人初名訥字辨老與其兄漢老俱工詩幼隨官居濟南二十餘載後南渡居陳數與余先子唱酬為人俊爽滑稽每尊俎間一談一笑可喜科舉連蹇竟不第年五十餘陳陷死平生詩甚多大概尖新長于對屬其佳句有云午風襟袖如秋早甲夜闌干得月多又濟南泛舟云人行著色屏風裏舟在回紋錦字中又上先人云南山有後傳能賦北闕無人繼敢言送余赴試云文章四海名父子孝友一門佳弟兄又贈王清卿云長拖酒債杜工部新有詩聲侯校書贈馬元章云曽著麻鞋見天子敢將道服襯朝衣又車轂春雷震屋山馬蹄亂雹響柴關何時得個茅庵子不在車塵馬足間又畫馬末云神物世間尋不見五陵春草色萋萋仲兄譙字庭老亦好古作詩不凡寧知微字明甫宿州人博學無所不知尤長于史事劇談古今治亂或諸家文章厯厯不可窮援筆為詩文亦敏贍可喜舉經義連不中遷居淮陽與余遊二載家積書萬卷載以行麻知幾及余先子皆重之後還鄉遭亂不知所在或云渡淮在南中余嘗有西遊詩四十餘篇明甫取而觀一夕盡和其韻以見示其間佳句甚多崔遵字懷祖燕人父建昌字萬卿名進士懷祖少有詞賦聲所交皆名士纍舉不第南渡輟科舉不為居嵩山下以讀書作詩為事正大末北兵入河南懷祖為兵所得脅令往招洛陽見殺嘗有詩云青山似有十年舊小雪又為三日留元裕之稱之曹恆字君章應州人髙丞相汝礪之壻也少讀書不喜為科舉計惟孤介不肯事富貴人南渡居大梁葺軒種竹號友直余先子為作記賦之又好收古人書畫器物藹然有士君子風遭亂病歿有子之謙擢第王賓字德卿亳州人擢第為虹令有聲入為省掾坐事罷遭亂還鄉會兵變賓起率衆據城復屬金朝已而見殺案中州集傳云亳州為單父軍楊春所據春以事出賓與故譙縣尉王進反正朝廷授進集慶軍節度使賓同知軍事後又為行部尚書金史本傳載賓罷歸鄉里後亳州軍變賓約城中軍民復其州哀宗嘉之授賓同知節度使哀宗遷蔡賓奉迎于州北之髙安擢為刑部尚書及鎮防軍崔復哥王六千之徒擐甲譁譟拽賓往市中害之並視此志所敘較詳而此志既敘其復城仍似以省掾終殆由傳聞未備也為人恢諧輕脫嗜酒無威儀詩頗工有上先子云致君有道莫如律敢諫不行猶得名歸潛志卷三
