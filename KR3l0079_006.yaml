  - {type: page-break, offset: 0, content: '', id: KR3l0079_WYG_006-1a, image: WYG1040/WYG1040-0259c.png}
body:
  text: 歸潛志卷六元劉祁撰髙丞相汝礪字岩夫應州人少擢第入仕有能名嘗為左司郎中諫議大夫入户部専掌財賦遷尚書改三司副使倡行鈔法以代貨泉宣宗南渡拜參知政事遷左右丞進平章政事右丞相封夀國公正大初薨于位年七十餘為人慎密廉潔能結人主知守格法循默避事不肯強諫故為相十餘年未嘗有譴訶夀考康寧當世莫及金國以來書生當國者惟公一人耳賈左丞守謙字彥亨案中州集傳賈益謙字亨甫本名守謙避哀宗諱改焉金史本傳稱益謙而章宗本紀稱右諫議大夫守謙蓋守謙在章宗時猶未易名故原其始書之此志撰于哀宗之後不著避諱改名當是傳寫訛脫東平人少擢第蒞官以能稱章宗時為諫議大夫皇叔鎬王以疑忌下獄公力爭士論直之大安末拜參知政事南渡進右丞遷左丞致仕薨胥平章鼎字和之代之繁畤人父持國章宗時執政公少擢第以能稱為右司郎中善占對大安末為參知政事案金史本傳云至寧初拜參知政事考至寧前為崇慶二年大安又在崇慶之前此志所云大安末與本傳至寧初迥異俄出鎮平陽案大金國志云出為平陽節度使考金史本傳鼎于貞祐元年十一月出為兖州泰定軍節度使未赴二年五月留為汾陽軍節度使兼汾州管內觀察使十一月改知平陽府事兼河東南路兵馬都總管金史地理志云平陽府初為次府罝建雄軍節度使天會六年升總管府金史百官志云諸總管府謂府尹兼領者都總管一員正三品掌統諸城隍兵馬甲仗總判府事是都總管與節鎮本異況胥鼎固知平陽府事者大金國志云出為平陽節度使有誤此志云出鎮平陽亦似節鎮然都總管掌統兵馬亦可云鎮其非節度使金史足證宣宗南渡行臺河中兵民安輯進平章政事兼左副元帥移鎮京兆封莘國公後朝廷將伐宋取蜀召議公歸上言止之坐是忤旨致仕薨案金史本傳貞祐三年就拜本路宣撫使四年拜樞密副使進拜尚書左丞興定元年正月拜平章政事封莘國公三月朝廷詔鼎舉兵伐宋鼎分兵由秦鞏鳯翔二路並進上書言當遴選材武將士分布近邊州郡敵至則追擊去則力田以廣儲蓄詔下尚書省以諸軍既進議遂寢二年四月鼎奏天子操大綱責成功況今多故豈可躬親細務宣宗覽奏不悅俄以伐宋有功遷官一階時元兵大舉入陜西鼎多料敵之䇿朝臣或中沮之宣宗諭樞密院曰胥鼎規畫必無􅍝誤自此卿等不須指受四年進封溫國公致仕諭曰卿屢求退今從卿請仍可來居京師有事得就咨決哀宗正大二年起復拜平章政事進封英國公行尚書省于衛州鼎以衰病辭不許三年七月薨據傳所敘官階知遇甚詳其忤旨以諫躬親細務非因諫伐宋且厯久彌見倚任屢請乃致仕後又起用與此志迥異公通達吏事有度量為政鎮靜所在無賢不肖皆得其歡心南渡以來書生有方面之柄者惟公一人而已張左丞行信字信甫先名行忠避末帝舊諱改焉莒州人御史大夫暐之子太子太傅行簡之弟也家世以純厚稱士論以為如漢萬石君家公少擢第厯清要宣宗南渡為禮部尚書時丞相珠格髙琪擅權百官側目因廷議事公獨抗言折之上甚喜明日拜參知政事未幾為近侍所譖出鎮涇州到官上疏論近侍之姦士大夫稱重正大初首召拜左丞言事稍不及前人望頗減案滏水集張左丞傳上即位驛召起授尚書左丞首言先帝初即位詔天下刑不上大夫丞相髙琪奏定職官犯罪的決百餘條乞依舊制或謂公首蒙聖主擢用雖有建明多不契上旨云云是行信拜左丞以後亦侃直不逢合而金史本傳移併正大初所奏于興定間似與此志相符然此志云稍不及前非謂默無一言當以滏水集所云參證後致仕數年薨為人簡朴不修威儀惡衣糲食如貧士既致仕家居惟以抄書教子孫為事葺園池東城號靜隱亭時時遊詠其間為樂南渡宰執中最有直名初至南京父暐以御史大夫致仕猶康健兄行簡為翰林學士承旨公為禮部尚書諸子姪多中第居官當世未之有也侯平章摯字莘卿東阿人少擢第慷慨有為貞祐初北兵圍燕都公由麴使請出募軍已而膺城有功自行户部侍郎遷河平軍節度使宣宗南渡為參知政事出鎮東平移鎮下邳所至吏民安愛後入朝遷左丞正大初進平章政事封蕭國公案本傳起為平章政事封蕭國公在天興元年八月與此志所云正大初有異居相位憤無所施請守大名詔出行尚書省未幾還朝致仕居南京有園亭蔡水濱公日在其間與耆老宴飲後南京降以前宰執為北兵所殺為人有威嚴御兵人莫敢犯在朝遇事亦敢言頗喜薦士如張文舉雷希顔麻知幾皆由公進用南渡後宰執中人望最重李參政鞏字君美河中人少擢第有能名南渡為參知政事出鎮平陽北兵至城陷自殺從子復亨字仲修踰冠擢第以才能稱為人通敏善奏對南渡為左司郎中大為宣宗所器一時譽甚隆遷翰林直學士知開封府進吏部尚書為參知政事年方四十父母俱存近世未有也興定末坐監試進士失取人出鎮同州未幾北兵攻城陷自殺叔姪相繼執政俱死事士論所嘉愚軒趙宜之挽仲修詩云報君惟有死見叔固無慙人以為破的也師參政安石字仲安清州人少擢第輕財尚氣義聞于朋友為省掾宣宗南渡從完顔福興守燕都福興將死以遺表託仲安使赴行在既達上嘉之擢樞密院經歷官時末帝在春宫領院事遂見知遇正大初進同簽樞密院事遷御史中丞工部尚書遂為參知政事其驟用如此既居位人望頗減俄以腦疽薨案金史本傳正大三年權左參政四年進右丞此志稱師參政而不書右丞與本傳異又本傳正大五年臺諫劾近侍張文夀張仁夀李麟之安石亦論列三人不已上怒甚安石疽發腦而死故本傳贊曰安石不負承惲之託遂見知遇以論列近侍觸怒而死悲夫然則安石既入相後以諤諤之行被譴而死為史傳所推許與此志所云人望頗減有異李左丞蹊字貫之大興人少擢第通吏事能官南渡為左司郎中遷吏部侍郎為富察和卓所陷案富察和卓舊作蒲察合住今改下獄當死詔釋之後為大司農正大初拜參知政事進左右丞専掌財賦北兵圍南京坐糧不給除名久之起為工部尚書權參知政事復左丞奉使軍前送曹王案哀宗本紀天興元年三月壬寅左丞李蹊送曹王出質六月乙亥李蹊送曹王與其子同俱還十月以李焕飛語詔左丞李蹊户部侍郎楊慥下獄俄並除名據所載則送曹王出質在坐糧不給除名之前與此志有異後從末帝東征至睢陽古納之變見殺烏克遜參政仲端字子正女直進士也為人謹厚蒞官以寬靜稱興定間由禮部侍郎使北朝從入西域二年始歸為陳州防禦使案金史本傳云朝廷嘉其有奉使勞進官兩階歷裕州刺史與此志所云防禦使有異遷御史中丞為參知政事人望甚隆天興東狩罷為翰林學士承旨案金史本傳正大元年召為御史中丞奉詔安撫陜西及歸權參知政事復以事貶同州節度使及哀宗將遷歸德召為翰林學士承旨兼同簽大睦親府事據所載則由參政罷為節度使非即罷為翰林學士承旨又其罷參政也在未狩之前與此志所云天興東狩罷為翰林學士異知時事不可為家居一室陳平生玩好日與夫人宴飲為歡癸巳正月下旬忽閉門自縊其夫人亦從死明日崔立之變若先知者金國亡大臣中全節義者一人公使歸時備談西北所見屬趙間間記之趙以屬屏山屏山以屬余余為録其事趙書以石迄今傳世完顔參政蘇蘭字伯揚至寧元年女直進士魁也蒞官修謹得名然苛細不能任大事較之輩流頗可稱仕厯清要時望甚隆為宣宗所知擢任近侍局頗直言有補益旋罷出為諫議大夫居父喪不飲酒食肉廬墓三年後為參知政事同赫舍哩雅爾呼達守京兆案赫舍哩雅爾呼達舊作紇石烈牙忽帶今改不相協召還案金史本傳正大七年七月行省于京兆未幾遷金安軍節度使兼同華安撫使既而召還朝非自京兆守被召與此志所云異至陜被圍久之亡奔行在道遇害與余先子善弟努森案努森舊作奴申今改字正甫亦女直進士仕厯清要由吏部侍郎使北朝凡再往天興東狩拜參知政事案金史本傳正大五年九月以御史大夫奉使大元明年六月遷吏部尚書復往八年春拜參知政事考哀宗本紀正大九年正月改元開興四月改元天興十二月乃詔議親出是努森使元非由吏部侍郎其拜參知政事在東狩之前與此志俱異留守南京齪齪不能有為崔立之變見殺完顔右丞呼沙呼字仲德案呼沙呼舊作忽斜虎今改考金史完顔仲德傳以此三字為仲德本名則仲德乃其改名也大金國志亦與金史同此志云字仲德或即以字為名歟女直進士也為人忠實有時望嘗帥秦鞏天興改元南京被圍仲德提孤軍入援轉戰數回止存五六人至京城門遇末帝東狩因從以行駐睢陽拜參知政事案金史本傳以天興元年九月拜參知政事在哀宗東狩以前四月與此志所云從帝東狩拜參知政事異從徙蔡州進右丞案哀宗本紀天興元年十二月辛丑駕至開陽門外鞏昌元帥完顔呼沙呼至自金昌東行之議遂決以為尚書右丞二年六月己亥上入蔡州據所載則呼沙呼為右丞在徙蔡之前一年與此志異間關險阻中盡心不懈蔡圍既急末帝內禪崩城陷仲德帥兵三百力戰不支赴蔡水死軍士皆從之其得士雖古之田橫無以加也金國亡死君者惟仲德完顔平章哈達案哈達舊作合打今改由護衛入官典郡嘗陷北朝亡歸南都纍擢平涼帥為人勇敢忠實一時人望甚隆拜參知政事代胥相鼎鎮京兆軍民便之北兵犯蘭關將兵拒戰有功入朝進平章政事封芮國公正大末北兵由襄漢大入詔哈達帥精兵拒之已而失利退保釣臺軍敗見殺完顔中郎將綽華善字良佐案綽華善舊作陳和尚今改金史本傳云名彝以小字行豐州人兄色埓必爾罕世襲明安也案色埓舊作斜烈今改忠義勇敢著名嘗陷北朝亡歸擢帥夀泗威望甚重性好士幕府延致文人改安平都尉常憤鬱無所施發病死良佐從其兄在軍中勇冠一時嘗坐擅殺人將抵死上竒其材特赦之為忠孝軍總領擢禦侮中郎將天興改元北兵入河南良佐從完顔哈達力戰鈞臺軍敗被擒不屈死案元好問贈鎮南節度使良佐碑天興元年鈞州陷北兵下城即縱兵以防巷戰者鎮南避隱處殺掠稍定即出而自言我金國大將欲見白事云云是未嘗被摛已欲殉節挺身而出者金史本傳亦備敘其殉節之烈與此志詳略迥異良佐為人愛重士大夫王渥仲澤在其兄幕府良佐從之遊學仲澤書極可觀且同講經學讀書不輟亦一時弟兄良將帥也伊喇都尉瑪努勒案瑪努勒舊作買奴今改字溫甫契丹世襲明安也讀史書慷慨有氣義喜交士大夫每以肝膽許人尤重然諾嘗為宣撫使便宜鄧豫間以事杖殺經歷官坐廢後為虎賁都尉提兵赴關中後由商南全軍而回病死自號拙軒趙間間為賦之諸公皆有詩正大初先子令葉余往省會溫甫屬余為拙軒銘先子亦有詩伊喇樞密聶赫案聶赫舊作粘合今改字廷玉契丹世襲明安也弟兄俱好文幕府延致名士初帥彭城雷希顔在幕楊叔能元裕之皆遊其門一時士望甚重為將鎮靜守邊不擾軍民便之天興東狩知國亡率鄧州軍民詣宋人納款宋以兵馬轄處之賜第居襄陽未幾病死南渡之初將帥中最著名者曰郭仲元俗號郭大相公其軍號花帽子曰郭阿林俗號郭三相公案金史本傳仲元本姓郭與阿林均賜姓完顔其軍號黃鶴袖二人本非親兄弟以其壯勇年齒先後為配仲元為將重厚沈毅有謀守鳳翔北兵力攻數月不下而退卒保其城以聞後為兵部尚書右衛尉卒阿林最驍勇人莫能敵屢與北兵戰有功一時為士庶屬目後提兵關中與宋人戰馬倒被擒不知存歿也案金史本傳宋兵大至金兵敗阿林戰歿贈金紫光祿大夫西京留守與此志不知存歿有異南渡後諸女直世襲明安穆昆往往好文學與士大夫遊如完顔色埒兄弟伊喇廷玉溫甫總領瓜爾佳德固案瓜爾佳舊作夾谷今改珠格士玄烏凌阿肅孺輩作詩多有可稱德固勇悍在軍中有聲嘗送舍弟以詩亦可喜天興初提兵戍譙軍亂見殺南渡之後為將帥者多出于世家皆膏粱乳臭子若完顔巴薩案巴薩舊作白撒今改止以能打毬稱又完顔額爾克案額舊爾克作訛可今改亦以能打毬號板子元帥者又完顔鼎努案鼎努舊作定奴今改號三脆羮有以忮忍號火燎元帥者又赫舍哩雅爾呼達案舊作紇石烈牙忽𢃄亦作紇石烈牙吾塔今改號盧鼓椎好用鼓椎擊人也其人本出親軍頗勇悍鎮宿泗數年屢破宋兵有威好結小人心然跋扈不受朝廷制嘗入朝詣都堂詆毁宰執宰執亦不敢言而人主倚其鎮東亦優容之也尤不喜文士僚屬有長裾者輒取刀截去又喜凌侮使者凡朝廷遣使者來必以酒食困之或辭以不飲因併食不給使餓而去張用章嘗以司農少卿行户部過宿見焉雅爾呼達召飲張辭以有寒疾雅爾呼達笑曰此易治耳趣命左右持艾炷來當筵令人拉張卧遽爇艾于腹張不能爭遂灸數十又因會宴諸將并妻皆在座時共食豬肉饅首有一將妻言素不食豬肉雅爾呼達趣左右易之須臾食訖問曰爾食何肉其人對曰蒙相公易以羊肉甚美雅爾呼達笑曰不食豬肉而食人肉何也爾所食非羊肉也其人大嘔疾病數日又御史大夫和卓因事過宿案和卓舊作合住今改雅爾呼達館之酒肉使妓歌于前及夜因使其妓侍寢遲明將發令妓徵錢和卓愕然雅爾呼達因強發其篋笥取繒帛悉以付妓曰豈有官使人而不與錢者乎和卓無以對而去故司農御史皆不敢入其境避之又宿州有營妓數人皆其所喜者時時使一妓佩銀符屢往州郡取賕賂州將夫人皆逺迎號省差行首厚贈之其暴橫若此及康錫伯祿為御史上章言其事且曰朝廷容之適所以害之欲保全其人宜加裁制然朝廷竟不能治其罪後北兵入境移鎮京兆軍敗召還道病死在東方時盧鼓椎之名滿民間兒啼亦可怖大槩如呼瑪呼云任履真字子山許州長葛人讀書喜雜學深于醫又有善行邑人皆信之貞祐初召入太醫院旋告歸與間間屏山諸公及余先子善先子主長葛簿修儒宫及太虛觀子山之力居多為醫起人疾甚衆既卒間間志其墓云張子和睢州考城人初名從正精于醫貫穿難素之學厯厯在口其法宗劉守真完素藥多用寒涼然起疾救死多取效士大夫稱焉為人放誕無威儀頗讀書作詩嗜酒久居陳遊余先子門後召入太醫院旋告去隱然名重東州麻知幾九疇與之善使子和論説其術因為文之有六門三法之目將行于世會子和知幾相繼死迄今其書存焉僧德普武川人自號勝靜老人倜儻有機術與士大夫遊飲酒食肉豁如也嘗為珠赫髙琪所重在軍中論兵南渡居陳之開元寺與余先子善嘗著彌陀偈談理性先子為序之屏山亦喜其俊爽不羈也頗喜字畫作詩年六十餘死余謂古之文暢祕演之流僧圓基字子初姓田氏亦北人雖為浮屠善與豪士遊負其材略有握兵治民之意蓋隱于僧者也嘗住持南京靜安寺以不檢去之峴山厯嵩陽死與德普相善頗能詩嘗題伊喇右丞畫云調燮之餘總是間間中遊戲到毫端而今亦有丹青手猶在磻溪把釣竿可見其有志也又詠栁葉云一氣潛通造化中人間無處不春風莫嫌冷地開青眼試看夭桃幾日紅王赤腿不知其名字年齒人以其衣短號哨腿王或云名豫可字南雲河東人幼嘗為卒不謹居郾蔡間以乞食為事衣皮衣露膝長嘆好插花額上繫一銅片如月人問之皆有説又時時自言為天帝所召有某仙某神在焉所食何物皆誕詭莫可測然善歌詩有求之者索韻立成字亦怪異在郾城凡寺觀樓閣及民家屋壁書其詩殆遍往往有竒麗語如天仙有夢梅云鼎鑄陶鈞政格新橫斜疏影慰騷魂嬰香枕簟黃昏月懋棣東風笑谷春又經間璈几虛雲鎖杯捲江山枕島樓卻憶西巖舊宫殿半橫星斗下瀛洲又題石潭云石裂雯華浸月秋又松隂滚碎闌干角其他多僻怪不可曉問之則曰出天上何書書名亦不可曉或云為鬼物所憑麻知幾獨重之李子遷贈詩云骯髒風儀古丈夫鶴袍鐵面戟髭鬚人間春色向頭剩天上月明當額孤石鼎夜聨詩句健布囊春醉酒錢粗危樓試倚街頭月應見潛飛入玉壺狀其人殆盡正大初余過郾諸公為召至索詩求韻立書辭亦不可曉後因病卒後因病失一目明遭亂北渡病死案大金國志遭亂為順天軍將領所得知其名議欲挈之北歸館于州之瑞雲觀明日見將領自言曰我不欲住君家瑞雲觀也越三日卒後有見之淮上者與此志可以考異歸潛志卷六
